# open-iscsi's compiled-in defaults otherwise govern every session on a
# worker: the stock iscsi-tools extension ships no iscsid.conf and Talos
# creates none, so /etc/iscsi holds nothing but initiatorname.iscsi. Those
# defaults assume a multipath SAN, where giving up on an unresponsive path
# after five seconds is free because a second path takes the I/O. There is a
# single portal to the NAS here and no second path, so giving up fast gives
# up the filesystem: the SCSI layer returns EIO, ext4 aborts the journal, and
# the mount latches read-only until it is unmounted and repaired. A NAS that
# is merely slow has to be waited out rather than abandoned.
#
# noop_out_timeout 30s — the liveness probe has to outlast how long a busy
# pool can take to answer a control PDU. A txg sync under write pressure, or
# a scrub competing for the same spindles, stalls the ZIO pipeline for tens
# of seconds; ZFS's own hung-I/O threshold sits an order of magnitude beyond
# that, so it treats such stalls as slow rather than broken. 30s clears the
# realistic stall band with margin and stops well short of the point where a
# stall is better read as a failure.
#
# noop_out_interval 10s — with the timeout above, a genuinely dead target is
# detected in 40s instead of 10s. That is the cost side of this trade and it
# is accepted deliberately: a dead target stays dead and waiting longer
# changes nothing, whereas a filesystem abandoned prematurely needs a human
# with fsck.
#
# replacement_timeout 300s — the window in which the SCSI layer queues I/O
# rather than erroring it, and the last thing standing between a dropped
# session and an aborted journal. Sized to cover a target-service restart and
# an ordinary appliance reboot including pool import. Not longer, because
# past that point the workload is already down from the application's
# perspective and an honest EIO beats an unbounded uninterruptible hang that
# also blocks umount, pod deletion and node drain. Not -1 for that same
# reason, which queues forever and never gives up. And emphatically not 0,
# which is not the milder of the two extremes but the opposite one: it errors
# I/O the instant a session drops, which is the journal-aborting behaviour
# this file exists to prevent, reached sooner.
#
# These values are read only when a node record is first created. The record
# then persists under /var/lib/iscsi/nodes on the /var partition and
# iscsiadm --login reuses it rather than re-deriving it from this file, so it
# outlives logout, re-stage and reboot: a target that has ever been attached
# keeps its old values until its record is explicitly deleted. Detaching the
# volume is not enough — the rollout runbook in docs/OPERATIONS.md deletes
# stale records as a rollout step.
node.conn[0].timeo.noop_out_interval = 10
node.conn[0].timeo.noop_out_timeout = 30
node.session.timeo.replacement_timeout = 300
