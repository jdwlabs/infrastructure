# The one definition of what vllm-inference serves. Changes are applied with
# `talops vllm apply --confirm` in an announced window; merging this file
# applies nothing on its own.
image: docker.io/vllm/vllm-openai:v0.24.0@sha256:251eba5cc7c12fed0b75da22a9240e582b1c9e39f6fbc064f86781b963bd814f
# Trial candidate from the weekly model audit: Qwen3.8-27B in NVIDIA's NVFP4
# build, which the RTX 5090 runs natively and which leaves 3.1 GiB of the
# estimated budget free. The previous model was
# QuantTrio/Qwen3-Coder-30B-A3B-Instruct-AWQ@c58857a7f41c0920f73d1b56678640f9c02017d7
# with --quantization=awq_marlin; reverting this file restores it.
model:
  repo: nvidia/Qwen3.8-27B-NVFP4
  revision: 482ca0f3832238542f8f5295dde86b5f22711d80
# A neutral name, so a model swap never needs a rename that every consumer
# has to follow in lockstep.
servedName: local-chat
# The server also answers to the previous name, so @server answers and
# LiteLLM's sre-investigator-local and pr-reviewer routes keep working while
# each moves to local-chat separately. Responses report local-chat whichever
# name was requested. Drop this once all three consumers request local-chat
# (docs/vllm-serving.md, "Renaming the served model").
servedAliases:
  - qwen/qwen3-coder-30b-a3b
port: 8000
args:
  # No --quantization: the checkpoint is ModelOpt mixed precision (NVFP4 and
  # FP8 layers, quant_algo MIXED_PRECISION), and vLLM picks modelopt_mixed
  # from its quantization_config.
  - --max-model-len=32768
  # vLLM's default of 256 concurrent sequences also sets CUDA-graph capture
  # up to batch 512, and that profiling ran this hybrid model out of GPU
  # memory at startup (30 GiB in use, a further 1.5 GiB requested) after its
  # 19 GiB of weights loaded. The consumers send a few requests a minute, so
  # 8 sequences cover them, and capture stops at batch 16.
  - --max-num-seqs=8
  - --enable-auto-tool-choice
  - --tool-call-parser=qwen3_xml
  # A multimodal wrapper: skipping the vision tower keeps startup inside the
  # memory the audit estimated, and every consumer sends text only.
  - --language-model-only
  # Qwen3.8 thinks before answering by default. @server answers in one
  # 256-token chat line, so thinking is turned off server-wide; the chat
  # template honours enable_thinking=false. vLLM rewrites the dotted option
  # into the JSON its parser expects.
  - --default-chat-template-kwargs.enable_thinking=false
healthGate:
  timeout: 10m # model load on this card is minutes, not seconds
