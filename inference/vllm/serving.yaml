# The one definition of what vllm-inference serves. Changes are applied with
# `talops vllm apply --confirm` in an announced window; merging this file
# applies nothing on its own.
image: docker.io/vllm/vllm-openai:v0.24.0@sha256:251eba5cc7c12fed0b75da22a9240e582b1c9e39f6fbc064f86781b963bd814f
model:
  repo: QuantTrio/Qwen3-Coder-30B-A3B-Instruct-AWQ
  revision: c58857a7f41c0920f73d1b56678640f9c02017d7
# A neutral name, so a model swap never needs a rename that every consumer
# has to follow in lockstep.
servedName: local-chat
# The server also answers to the previous name, so @server answers and LiteLLM
# sre-investigator-local keep working while each moves to local-chat
# separately. Responses report local-chat whichever name was requested. Drop
# this once both consumers request local-chat (docs/vllm-serving.md,
# "Renaming the served model").
servedAliases:
  - qwen/qwen3-coder-30b-a3b
port: 8000
args:
  - --quantization=awq_marlin
  - --max-model-len=32768
  - --enable-auto-tool-choice
  - --tool-call-parser=qwen3_xml
healthGate:
  timeout: 10m # model load on this card is minutes, not seconds
