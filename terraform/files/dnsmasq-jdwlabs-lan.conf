# LAN-only split-horizon resolver for jdwlabs.com, served from the HAProxy
# VM. The gateway (192.168.1.254) forwards jdwlabs.com upstream unchanged and
# returns the public WAN answer to every LAN client — see
# docs/lan-name-resolution.md for how that was confirmed. This file is the
# single source of truth for the override, deployed two ways that must stay
# identical: baked into the HAProxy VM's cloud-init for any future rebuild
# (terraform/templates/haproxy-cloud-init.yaml.tftpl), and installed by hand
# on the VM that is live today (scenarios/lan-dns-resolver-deploy.md).
#
# Values below are hardcoded rather than templated because there is exactly
# one instance of this VM today (no HA peer yet) and its address is already
# fixed at the Terraform layer (see haproxy_vms in terraform.tfvars) — a
# second instance would need its own listen-address, which is a rebuild-time
# decision, not a reason to parameterize an address nothing else can hold yet.

# Bind only this VM's own LAN address. Never wide open on 0.0.0.0 — this VM
# already carries the API and ingress attack surface, and binding narrowly is
# what makes "which address answers this" a one-line fact instead of a guess.
listen-address=192.168.1.199
bind-interfaces
port=53

# Answer only from the data below and the upstream forwarder. Never let this
# host's own /etc/hosts or /etc/resolv.conf leak into the answer set — either
# would make the resolver's behaviour depend on files this config doesn't own,
# and /etc/resolv.conf here points at systemd-resolved's own loopback stub,
# which would create a resolution loop if consulted.
no-hosts
no-resolv
domain-needed
bogus-priv

# The override: apex and every subdomain of jdwlabs.com resolve to this host,
# which fronts the Kubernetes/Talos APIs (6443/50000) and HTTP(S) ingress
# (80/443) alike. This is a real wildcard, unlike the `*.jdwlabs.com` hosts-
# file lines it replaces, which were inert because the hosts format has no
# wildcard syntax at all. Covering the whole domain rather than an per-name
# list is deliberate: every jdwlabs.com name that isn't this override already
# reaches the same host by hairpinning out to the WAN address and back (see
# docs/lan-name-resolution.md), so pointing the whole domain here is strictly
# a shortcut, not a behaviour change, for every name proven so far. If a
# future subdomain is intentionally hosted somewhere else, it needs an
# explicit exception line added above this one — dnsmasq takes the most
# specific match.
address=/jdwlabs.com/192.168.1.199

# Everything else — attlocal.net records, the wider internet — forwards to
# the gateway, which is also this network's only DHCP server. No other
# upstream is configured: a second forwarder here would let this resolver
# keep answering non-jdwlabs.com names even if the gateway's own DNS role
# changes, which is not a behaviour this override should have on its own.
server=192.168.1.254

# This resolver is DNS-only. dnsmasq can also serve DHCP, but no dhcp-range
# or dhcp-host directive is set anywhere in this file, so that half of it
# never activates — the network already has one DHCP server (the gateway),
# and a second one racing it for leases would be a much worse outage than
# the one this file is meant to close.
