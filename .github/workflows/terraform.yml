name: Terraform

# Own path is in the filter so an edit to this workflow re-triggers the
# validate job it changed; without it, a broken edit merges untested.
on:
  push:
    branches: [main]
    paths: ['terraform/**', '.github/workflows/terraform.yml']
  pull_request:
    branches: [main]
    paths: ['terraform/**', '.github/workflows/terraform.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
      - run: terraform fmt -check
      - run: terraform init -backend=false
      - run: terraform validate
