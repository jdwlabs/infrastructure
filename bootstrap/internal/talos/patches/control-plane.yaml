machine:
  type: controlplane
  install:
    # No extraKernelArgs here. These nodes boot UEFI, so Talos installs a UKI
    # under systemd-boot and takes the kernel cmdline from inside that signed
    # image — the cmdline the host assembles from this field is never
    # consulted, which is why upstream deprecated it in favour of building a
    # proper installer with Image Factory/imager. The nocloud image already
    # carries `console=tty1 console=ttyS0` in the UKI cmdline, so the console
    # arguments this used to set were redundant as well as unreachable.
    # Re-adding them would also make the config invalid rather than merely
    # inert: base configs generated by talosctl 1.12 and later set
    # grubUseUKICmdline, and the two cannot be used together.
    disk: /dev/{{ .DefaultDisk }}
    grubUseUKICmdline: true
    extraKernelArgs:
      - console=tty0
      - console=ttyS0
  network:
    interfaces:
      - interface: {{ .DefaultNetworkInterface }}
        dhcp: true
    extraHostEntries:
      - ip: {{ .HAProxyIP }}
        aliases:
          - {{ .ControlPlaneEndpoint }}
  kubelet:
    extraArgs:
      rotate-server-certificates: "true"
    extraConfig:
      systemReserved:
        cpu: 250m
        memory: 512Mi
      kubeReserved:
        cpu: 250m
        memory: 512Mi
  kernel:
    modules:
      - name: nvme_tcp
      - name: vfio_pci
      - name: zfs
cluster:
  etcd:
    extraArgs:
      quota-backend-bytes: "4294967296"
      auto-compaction-mode: periodic
      auto-compaction-retention: "1"
      heartbeat-interval: "500"
      election-timeout: "5000"
      # Dedicated metrics-only listener. 2381 serves /metrics and /health and
      # exposes no client API, so opening it does not widen access to the
      # datastore the way exposing 2379 would. Without it etcd publishes
      # metrics only behind the mTLS client port, which Prometheus cannot
      # scrape — leaving the component whose degradation is cluster-fatal with
      # no telemetry, and incident diagnosis reduced to reading apiserver logs.
      listen-metrics-urls: http://0.0.0.0:2381
  apiServer:
    # Trust id_tokens from the platform Dex instance so Headlamp (OIDC
    # client "headlamp") can authenticate users against the API server.
    # The issuer is platform-layer (ArgoCD's Dex) — a deliberate upward
    # coupling: without it no human-facing SSO to the cluster exists.
    # The JWT authenticator initializes lazily, so the apiserver still
    # boots when the issuer is unreachable (e.g. during cluster bootstrap).
    extraArgs:
      oidc-issuer-url: https://argocd.jdwlabs.com/api/dex
      oidc-client-id: headlamp
      oidc-username-claim: email
      oidc-username-prefix: "oidc:"
    certSANs:
      - {{ .ControlPlaneEndpoint }}
      - {{ .HAProxyIP }}
      - 127.0.0.1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 2Gi
    admissionControl:
      - name: PodSecurity
        configuration:
          apiVersion: pod-security.admission.config.k8s.io/v1
          kind: PodSecurityConfiguration
          exemptions:
            namespaces:
              - longhorn-system
  controllerManager:
    extraArgs:
      # Talos binds this to 127.0.0.1, which makes :10257 unreachable from a
      # Prometheus pod on any other node. Binding wider does not remove
      # authn/authz — the port stays authenticated, it just becomes dialable.
      bind-address: 0.0.0.0
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
  scheduler:
    extraArgs:
      bind-address: 0.0.0.0
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        memory: 256Mi
  # extraManifests is deliberately empty. Both workloads bootstrapped this way
  # now ship as platform GitOps releases that pin an image tag, and each raw
  # upstream URL served a rolling tag — so whatever a config apply happened to
  # fetch decided what ran, on the schedule of someone else's push:
  #   metrics-server                -> platform-metrics-server (backs v1beta1.metrics.k8s.io)
  #   kubelet-serving-cert-approver -> platform-kubelet-serving-cert-approver
  # Clusters built before each removal keep the originals — see
  # scenarios/remove-talos-metrics-server.md and
  # scenarios/remove-talos-cert-approver.md for the by-hand cleanup.
  # Do not assume those leftovers are inert: 1.13 records every applied
  # bootstrap manifest in kube-system/talos-bootstrap-manifests-inventory and
  # prunes entries missing from the desired set by default, and the manifest
  # sync runs on `talosctl upgrade-k8s`, not only at bootstrap. That inventory
  # still lists the cert-approver Namespace on this cluster, so a prune there
  # would cascade to everything the GitOps release owns inside it — pass
  # --manifests-no-prune until the inventory has caught up.
  allowSchedulingOnControlPlanes: false
---
# virtio_net leaves tx-checksum-ip-generic enabled on flannel's VXLAN link, so
# inner TCP checksums are never filled in after encapsulation; the receiving
# node's conntrack marks those packets INVALID and kube-proxy's nftables rules
# drop them, silently blackholing cross-node pod TCP while ICMP still passes.
# rx-checksumming is fixed-on under virtio_net, so the only lever is sender-side
# tx offload, disabled on every node. The feature set mirrors the interim
# in-cluster DaemonSet (ethtool -K tx-checksum-ip-generic/tx/gso/gro/tso off)
# so behaviour is unchanged while that DaemonSet is retired. Talos re-applies
# this whenever the EthernetSpec reconciles, which covers boot-time creation of
# flannel.1; after flannel upgrades that recreate the link mid-life, re-check
# with `talosctl get ethernetstatus flannel.1`.
apiVersion: v1alpha1
kind: EthernetConfig
name: flannel.1
features:
  tx-checksum-ip-generic: false
  tx-generic-segmentation: false
  tx-tcp-segmentation: false
  tx-tcp6-segmentation: false
  rx-gro: false
---
# Same offload set on the physical uplink as belt-and-braces: encapsulated
# packets leave through this NIC and virtio_net's tx offloads were implicated
# in the same checksum corruption.
apiVersion: v1alpha1
kind: EthernetConfig
name: {{ .DefaultNetworkInterface }}
features:
  tx-checksum-ip-generic: false
  tx-generic-segmentation: false
  tx-tcp-segmentation: false
  tx-tcp6-segmentation: false
  rx-gro: false
---
# Ships the kernel ring buffer off the node as newline-delimited JSON to the
# node-local collector pod, which listens on a hostPort. Without this, a fault
# that only the kernel sees never leaves the node: since Linux 6.12 ext4's error
# handler latches a mount read-only through an internal emergency bit rather
# than SB_RDONLY, so /proc/mounts keeps reporting rw and every layer above the
# kernel goes on reporting healthy. The ring buffer is the only signal that
# exists at the moment it happens.
#
# machine.logging.destinations is NOT this mechanism and does not cover kmsg —
# it carries Talos *service* logs only. Pointing it at the collector would ship
# service logs and still leave kernel faults invisible. The Talos API route
# (talosctl dmesg) is not usable either: it needs a talosconfig, which a
# collector pod has none of.
#
# KmsgLogConfig rather than the talos.logging.kernel kernel argument: that
# argument is set via machine.install.extraKernelArgs, which these nodes cannot
# use. They boot UEFI (bios = "ovmf"), and since Talos 1.10 a UEFI install is
# systemd-boot with a UKI whose cmdline is baked into the image, so the field is
# inert; on 1.12+ it is also mutually exclusive with install.grubUseUKICmdline,
# which defaults on, and `talosctl validate` rejects the pair outright. This
# document is applied at runtime instead — no reinstall, no reboot. Delivery
# begins when machined starts, but the reader opens /dev/kmsg at offset 0 and
# follows rather than tailing, so the ring buffer is replayed from the start and
# early boot lines still arrive. The real limit is wrap: on a long-uptime node
# the ring may already have overwritten itself, and the reader skips forward
# silently when it has, so contents predating the apply can simply be gone.
#
# If talos.logging.kernel is ever added alongside this, match the URL string
# byte for byte — cmdline and document destinations are deduplicated by exact
# string compare, so tcp://host:6050 and tcp://host:6050/ would double-deliver.
#
# Loopback is deliberate: the receiver is the collector pod on this same node.
# Talos kernel lines carry no hostname of their own, so only a per-node listener
# can attribute a message to the node that produced it — the collector stamps
# the node label from its own spec.nodeName. A shared Service in front of all
# the collectors would erase exactly the identity the signal is for.
apiVersion: v1alpha1
kind: KmsgLogConfig
name: node-local-collector
url: tcp://127.0.0.1:6050/
