# Documented exceptions to the cluster.extraManifests pinning requirement
# enforced by TestExtraManifestsArePinned (see ../extramanifests.go and
# ../extramanifests_test.go).
#
# Every entry MUST carry a non-empty `reason` explaining why the exception is
# deliberate. An entry that no longer matches an actual unpinned URL in any
# patch file is treated as stale and fails the check — remove it once the
# reference is fixed or no longer exists.
exceptions:
  - url: https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/main/deploy/standalone-install.yaml
    reason: >-
      pre-existing: this extraManifests URL predates this check and points at
      an unpinned /main/ branch ref. It is a live, already-tracked violation;
      remediation (repinning to a tag or commit SHA) is separate follow-up
      work, not bundled with introducing this check. Recorded here rather
      than silently ignored or hand-fixed as part of adding the check.
